<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Base Background -->
  <circle cx="50" cy="50" r="48" fill="#09090b" stroke="#dc2626" stroke-width="3" />
  <!-- Iris -->
  <circle cx="50" cy="50" r="38" fill="url(#irisGrad)" stroke="#18181b" stroke-width="2" />
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#18181b" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <!-- Pupil -->
  <circle cx="50" cy="50" r="9" fill="#09090b" />
  <circle cx="50" cy="50" r="14" fill="url(#pupilGlow)" pointer-events="none" />
  <!-- Tomoe 1 (Top) -->
  <g transform="translate(50, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#09090b" />
    <path d="M 0,-4.5 C 3.5,-4.5 5,-1 3,3 C 2,5 0,6 -2,5 C -0.5,3 -0.5,0.5 -1,-2 Z" fill="#09090b" />
  </g>
  <!-- Tomoe 2 (Bottom Right) -->
  <g transform="translate(71, 62) rotate(120)">
    <circle cx="0" cy="0" r="4.5" fill="#09090b" />
    <path d="M 0,-4.5 C 3.5,-4.5 5,-1 3,3 C 2,5 0,6 -2,5 C -0.5,3 -0.5,0.5 -1,-2 Z" fill="#09090b" />
  </g>
  <!-- Tomoe 3 (Bottom Left) -->
  <g transform="translate(29, 62) rotate(240)">
    <circle cx="0" cy="0" r="4.5" fill="#09090b" />
    <path d="M 0,-4.5 C 3.5,-4.5 5,-1 3,3 C 2,5 0,6 -2,5 C -0.5,3 -0.5,0.5 -1,-2 Z" fill="#09090b" />
  </g>
</svg>
